# Production profile — activate with SPRING_PROFILES_ACTIVE=prod

# Disable Swagger UI and OpenAPI docs in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Required JVM flag for headless servers (no display):
# -Djava.awt.headless=true
# Set this in JAVA_TOOL_OPTIONS in Docker or your process manager.
# Without it, ImageIO / Graphics2D may hang or throw on a headless Linux host.

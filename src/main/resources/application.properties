server.port=8080
server.servlet.context-path=/wristband-printer
server.shutdown=graceful

# Printer connection — override with PRINTER_HOST / PRINTER_PORT environment variables in Docker
printer.host=${PRINTER_HOST:printer}
printer.port=${PRINTER_PORT:9100}
printer.connect-timeout-ms=3000
printer.read-timeout-ms=3000

# Actuator on a separate internal port so it is not exposed on the public network interface
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,metrics
management.info.build.enabled=true
management.info.env.enabled=true
info.app.name=wristband-printer-service

# Never leak internal error details to callers
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

spring.main.banner-mode=off
